  <text x="310" y="138" fill="#F2F8FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="71" font-weight="800" letter-spacing="8">OLLAMA</text>
  <text x="313" y="203" fill="#8DEDF1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="2.5">SMART ROUTER</text>
  <text x="315" y="247" fill="#91A7BD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.6">ONE ENDPOINT / EVERY MODEL</text>
  <path d="M313 271H835" stroke="url(#underline)" stroke-width="4" stroke-linecap="round"/>
