# systemd drop-in for the community-scripts comfyui.service. install-target.sh
# installs it as /etc/systemd/system/comfyui.service.d/10-comfyui-target.conf.
# The community unit runs ComfyUI as root from /opt/ComfyUI with its data in
# that tree; this runs the release that /opt/comfyui-target/current points to
# as the unprivileged comfyui account, with every writable directory (models,
# custom nodes, input, output, temp, user settings and database) under
# /var/lib/comfyui-target.
[Unit]
Documentation=file:///etc/comfyui-target/README.md
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
User=comfyui
Group=comfyui
WorkingDirectory=/var/lib/comfyui-target
EnvironmentFile=/etc/comfyui-target/comfyui.env
Environment=HOME=/var/lib/comfyui-target
ExecStart=
ExecStart=/opt/comfyui-target/current/venv/bin/python /opt/comfyui-target/current/main.py --listen ${COMFYUI_LISTEN} --port ${COMFYUI_PORT} --base-directory /var/lib/comfyui-target --disable-auto-launch $COMFYUI_EXTRA_ARGS
Restart=on-failure
RestartSec=5
TimeoutStopSec=60
UMask=0027
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/comfyui-target
PrivateTmp=true
# Keep passed-through GPU devices visible. Access is restricted by CT devN entries.
PrivateDevices=false
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
