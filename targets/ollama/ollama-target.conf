# systemd drop-in for the community-scripts ollama.service. install-target.sh
# installs it as /etc/systemd/system/ollama.service.d/10-ollama-target.conf.
# It survives the community script's `update`, which only replaces the
# Ollama binaries under /usr/local/lib/ollama.
[Unit]
Documentation=file:///etc/ollama-target/README.md
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# The community unit runs as root with models in /root/.ollama; run as the
# unprivileged ollama account it creates, with data under /var/lib instead.
User=ollama
Group=ollama
WorkingDirectory=/var/lib/ollama-target
# EnvironmentFile= overrides the unit's Environment= lines, so these settings win.
EnvironmentFile=/etc/ollama-target/ollama.env
Environment=HOME=/var/lib/ollama-target
Restart=on-failure
RestartSec=5
TimeoutStopSec=60
UMask=0027
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/ollama-target
PrivateTmp=true
# Keep passed-through GPU devices visible. Access is restricted by CT devN entries.
PrivateDevices=false
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
